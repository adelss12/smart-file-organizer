name: Build Windows EXE

# يُبنى ملف EXE على خادم ويندوز من GitHub كلما تغيّر كود البرنامج،
# ويُنشر كإصدار باسم رقم الإصدار المكتوب في APP_VERSION داخل organizer_gui.py.
# لإصدار جديد: غيّر APP_VERSION وحدّث RELEASE_NOTES.md ثم احفظ التعديل.
on:
  push:
    branches: ["main"]
    paths:
      - "organizer_gui.py"
      - "RELEASE_NOTES.md"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import organizer_gui as m; assert m.tk is not None; print(m.APP_VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SmartFileOrganizer organizer_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFileOrganizer-${{ steps.ver.outputs.version }}
          path: dist/SmartFileOrganizer.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: منظّم الملفات الذكي v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/SmartFileOrganizer.exe
          body_path: RELEASE_NOTES.md
          make_latest: true
